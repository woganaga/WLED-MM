# BubblerTotem build environment - copy to ../platformio_override.ini and
# fill in your WiFi credentials (that file is gitignored)
# Board: ESP32-S3-DevKitC-1 N8 (8MB flash, NO PSRAM)
#
# Extends WLED-MM's esp32S3_8MB_S (no-PSRAM S3, speed-optimized, FASTPATH
# audio) but rewrites build_flags entirely: the base env's default pins all
# collide with the totem's hardware (IRPIN=15 = bubble motor, RLYPIN=21 =
# status LED, HW_PIN_SDA=42 = RS485, I2S pins wrong).

[platformio]
default_envs = bubbler_totem

[env:bubbler_totem]
extends = env:esp32S3_8MB_S
build_unflags = ${env:esp32S3_8MB_M.build_unflags}
  ${Speed_Flags.build_unflags}
build_flags = ${common.build_flags} ${esp32s3.build_flags} -Wno-misleading-indentation -Wno-format-truncation
  ${common_mm.build_flags_S}
  -D WLED_RELEASE_NAME=BubblerTotem
  ;; native USB CDC (no serial-to-USB chip on this board's USB port we use)
  -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MSC_ON_BOOT=0 -D ARDUINO_USB_DFU_ON_BOOT=0
  -D WLED_DISABLE_ADALIGHT ;; recommended for CDC mode (junk on unconnected RX), and totem never uses serial LED protocols
  ${Speed_Flags.build_flags_V4}
  -D WLEDMM_FASTPATH
  ${common_mm.animartrix_build_flags}
  -D WLED_WATCHDOG_TIMEOUT=0 -D CONFIG_ASYNC_TCP_USE_WDT=0
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  ;; LED hardware: 6 rings x 27 WS2811 (GRB = WLED default), two chains
  ;; GPIO4 = rings 3,2,1 / GPIO5 = rings 4,5,6 (see bubbler/generate_ledmap.py)
  -D DATA_PINS=4,5
  -D PIXEL_COUNTS=81,81
  ;; battery powered: conservative auto-brightness-limiter default
  -D ABL_MILLIAMPS_DEFAULT=1500
  ;; no button / relay / IR / analog mic on this build (motor + RS485 come
  ;; later as usermods on GPIO15 and 1/2/42)
  -D BTNPIN=-1
  -D RLYPIN=-1
  -D IRPIN=-1
  -D AUDIOPIN=-1
  ;; INMP441 I2S microphone
  -D SR_DMTYPE=1 -D I2S_SDPIN=8 -D I2S_CKPIN=44 -D I2S_WSPIN=7 -D MCLK_PIN=-1
  ;; join the home network on first boot (falls back to WLED-AP if absent)
  -D CLIENT_SSID='"YourNetworkName"'
  -D CLIENT_PASS='"YourNetworkPassword"'
lib_deps = ${esp32s3.lib_deps} ${common_mm.lib_deps_S}
  ${common_mm.animartrix_lib_deps}
lib_ignore = IRremoteESP8266
